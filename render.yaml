services:
  - type: web
    name: airsync-c2-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
